<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>中鱼机制总图 · 预览</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 14px; color: #222; }
  /* 画布跟着窗口长：整张图是竖长的（约 1376×2078），固定 840px 会把它压得太小。 */
  #dg { width: 100%; height: calc(100vh - 235px); min-height: 520px;
        border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  .note { color: #666; font-size: 12px; margin: 6px 0 10px; max-width: 1100px; line-height: 1.6; }
  pre { background: #f6f6f6; padding: 8px; border-radius: 4px; font-size: 12px; }
  #ver { color: #999; font-size: 11px; }
</style>
</head>
<body>
<h3>中鱼机制总图 <span id="ver"></span></h3>
<p class="note">
  <b>怎么看：</b>① 顶部三个按钮切换视图——<b>总图</b>（七大层全展开、中性配色）、
  <b>0.3.4.0-B</b>（只上配色与透明度：范围外元素调暗但不隐藏、不移位）、
  <b>0.3.4.0-B 聚焦</b>（只留本版触及的行）。<br>
  ② <b>点行标题条上的 ⇕</b> 收起／展开该行：收起后只留标题条，<b>下面的行自动上移</b>；
  展开时整行恢复、下面的行下移。每一层都是真容器（<code>childLayout</code>），层内再展开同样会让位。<br>
  ③ 改完 source 后本页会<b>自动刷新</b>；也可以手动刷新。
</p>
<div id="dg" class="mxgraph"></div>
<pre id="log">加载中…</pre>
<script src="../../spike/verify/vendor/viewer-static.min.js"></script>
<script>
(function () {
  var log = function (m) { document.getElementById('log').textContent = m; };
  var verEl = document.getElementById('ver');
  var currentVersion = null;

  // 稳健适配：viewer 创建时容器尺寸可能还没定，内置 auto-fit 会算成 scale=1。
  // 自己量一遍可见元素的真实范围再设定缩放，并在窗口尺寸变化时重算。
  function fit(v) {
    try {
      var g = v.graph, c = g.container;
      var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, n = 0;
      Object.keys(g.model.cells).forEach(function (k) {
        var st = g.view.getState(g.model.getCell(k));
        if (!st || !st.width) return;
        n++;
        minX = Math.min(minX, st.x); minY = Math.min(minY, st.y);
        maxX = Math.max(maxX, st.x + st.width); maxY = Math.max(maxY, st.y + st.height);
      });
      if (!n || !(maxX > minX) || !(maxY > minY)) return;
      var s = Math.min((c.clientWidth - 24) / (maxX - minX),
                       (c.clientHeight - 24) / (maxY - minY));
      if (!(s > 0) || !isFinite(s)) return;
      g.view.setScale(s);
      g.view.setTranslate(c.clientWidth / (2 * s) - (minX + maxX) / 2,
                          c.clientHeight / (2 * s) - (minY + maxY) / 2);
      g.view.validate();
    } catch (e) { /* 适配失败不影响交互 */ }
  }

  function render(xml) {
    var el = document.getElementById('dg');
    el.innerHTML = '';
    el.removeAttribute('data-mxgraph');
    delete window.__fcf;
    el.setAttribute('data-mxgraph', JSON.stringify({
      // resize:false 是必要的：resize:true 时 viewer 会把**图的内容尺寸**写成
      // 本容器的 inline 高度，页面被撑长而图不缩放，表现就是"显示不全"。
      // 关掉之后容器保持 CSS 尺寸，下面的 fit() 才是真正决定缩放的唯一来源。
      xml: xml, toolbar: 'zoom', border: 10, 'auto-fit': false,
      resize: false, 'max-width': '100%'
    }));
    GraphViewer.createViewerForElement(el, function (v) {
      window.__fcf = { viewer: v, graph: v.graph };
      fit(v);
      setTimeout(function () { fit(v); }, 120);
      log('就绪。改完 source 后本页会自动刷新；点标题条上的 ⇕ 收起／展开该层，'
          + '下面的层会自动让位。');
    });
  }

  function load() {
    return fetch('../generated/fcf-system-map.drawio', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(render)
      .catch(function (e) { log('加载失败: ' + (e && e.message ? e.message : e)); });
  }

  // 自动刷新：轮询产物哈希，变了就重绘
  function poll() {
    fetch('/api/version', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        verEl.textContent = '· ' + d.version;
        if (currentVersion === null) { currentVersion = d.version; return; }
        if (d.version !== currentVersion) {
          currentVersion = d.version;
          log('检测到新版本 ' + d.version + '，正在重新加载…');
          load();
        }
      })
      .catch(function () { /* 没有 /api/version（例如直接用静态服务）时静默降级 */ });
  }

  window.addEventListener('resize', function () {
    if (window.__fcf) fit(window.__fcf.viewer);
  });

  load().then(function () { poll(); setInterval(poll, 2000); });
})();
</script>
</body>
</html>
