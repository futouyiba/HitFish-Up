<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2050" viewBox="0 0 1800 2050">
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
  <style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
    .title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#475569}
    .section{font-size:19px;font-weight:700}.node{font-size:16px;font-weight:700}
    .body{font-size:14px;fill:#334155}.small{font-size:13px;fill:#64748b}
    .tiny{font-size:12px;fill:#64748b}.edge{font-size:13px;font-weight:700}
  </style>
</defs>
<rect width="1800" height="2050" fill="#fff"/>
<text x="900" y="50" text-anchor="middle" class="title">空间机会求值｜Gate 优先，聚合后置</text>
<text x="900" y="82" text-anchor="middle" class="sub">每个因子保持一条窄竖列；左 → 右只暗示求值顺序。任一 CORE Gate FAIL 直接提前返回，不再计算该 CORE 的 Fit，也不进入环境聚合。</text>
<text x="95" y="132" class="small">执行顺序暗示</text>
<line x1="220" y1="128" x2="1435" y2="128" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowGray)"/>
<rect x="60" y="165" width="260" height="555" rx="20" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
<rect x="350" y="165" width="260" height="555" rx="20" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
<rect x="640" y="165" width="260" height="555" rx="20" fill="#f7fdf8" stroke="#bbf7d0" stroke-width="2"/>
<rect x="930" y="165" width="260" height="555" rx="20" fill="#f7fdf8" stroke="#bbf7d0" stroke-width="2"/>
<rect x="1220" y="165" width="260" height="555" rx="20" fill="#fafafa" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="88" cy="195" r="17" fill="#e2e8f0"/><text x="88" y="201" text-anchor="middle" class="tiny">1</text>
<circle cx="378" cy="195" r="17" fill="#e2e8f0"/><text x="378" y="201" text-anchor="middle" class="tiny">2</text>
<circle cx="668" cy="195" r="17" fill="#e2e8f0"/><text x="668" y="201" text-anchor="middle" class="tiny">3</text>
<circle cx="958" cy="195" r="17" fill="#e2e8f0"/><text x="958" y="201" text-anchor="middle" class="tiny">4</text>
<polygon points="113,235 267,235 310,279 267,323 113,323 70,279" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
<text x="190" y="273" text-anchor="middle" class="node">CORE 因子 A</text><text x="190" y="297" text-anchor="middle" class="small">例如：水温</text>
<polygon points="190,350 280,405 190,460 100,405" fill="#fff7ed" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
<text x="190" y="398" text-anchor="middle" class="node">Gate？</text><text x="190" y="421" text-anchor="middle" class="small">先判断</text>
<rect x="95" y="510" width="190" height="82" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
<text x="190" y="543" text-anchor="middle" class="node">亲和 / Fit 计算</text><text x="190" y="569" text-anchor="middle" class="small">仅 Gate PASS 后</text>
<path d="M190 323L190 350" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
<path d="M190 460L190 510" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/><text x="205" y="489" class="edge">PASS</text>
<polygon points="403,235 557,235 600,279 557,323 403,323 360,279" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
<text x="480" y="273" text-anchor="middle" class="node">CORE 因子 B</text><text x="480" y="297" text-anchor="middle" class="small">例如：结构</text>
<polygon points="480,350 570,405 480,460 390,405" fill="#fff7ed" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
<text x="480" y="398" text-anchor="middle" class="node">Gate？</text><text x="480" y="421" text-anchor="middle" class="small">先判断</text>
<rect x="385" y="510" width="190" height="82" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
<text x="480" y="543" text-anchor="middle" class="node">亲和 / Fit 计算</text><text x="480" y="569" text-anchor="middle" class="small">仅 Gate PASS 后</text>
<path d="M480 323L480 350" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
<path d="M480 460L480 510" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/><text x="495" y="489" class="edge">PASS</text>
<circle cx="770" cy="285" r="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="770" y="278" text-anchor="middle" class="node">SECONDARY</text><text x="770" y="302" text-anchor="middle" class="small">因子 A</text>
<rect x="675" y="510" width="190" height="82" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
<text x="770" y="543" text-anchor="middle" class="node">亲和 / Fit 计算</text><text x="770" y="569" text-anchor="middle" class="small">无 Gate</text>
<path d="M770 355L770 510" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
<circle cx="1060" cy="285" r="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1060" y="278" text-anchor="middle" class="node">SECONDARY</text><text x="1060" y="302" text-anchor="middle" class="small">因子 B</text>
<rect x="965" y="510" width="190" height="82" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
<text x="1060" y="543" text-anchor="middle" class="node">亲和 / Fit 计算</text><text x="1060" y="569" text-anchor="middle" class="small">无 Gate</text>
<path d="M1060 355L1060 510" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
<rect x="1260" y="235" width="180" height="88" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1350" y="270" text-anchor="middle" class="node">IGNORED 因子</text><text x="1350" y="295" text-anchor="middle" class="small">不进入求值链</text>
<line x1="1285" y1="390" x2="1415" y2="520" stroke="#cbd5e1" stroke-width="3"/><line x1="1415" y1="390" x2="1285" y2="520" stroke="#cbd5e1" stroke-width="3"/>
<text x="1350" y="570" text-anchor="middle" class="small">无 Gate · 无 Fit · 无聚合线</text>
<path d="M100 405L42 405L42 760L145 760" fill="none" stroke="#dc2626" stroke-width="2.7" marker-end="url(#arrowRed)"/>
<path d="M390 405L330 405L330 720L145 720L145 760" fill="none" stroke="#dc2626" stroke-width="2.7" marker-end="url(#arrowRed)"/>
<text x="52" y="390" class="edge">FAIL</text><text x="335" y="390" class="edge">FAIL</text>
<path d="M190 592L190 690L500 690L500 850" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M480 592L480 850" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M770 592L770 850" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
<path d="M1060 592L1060 690L1040 690L1040 850" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
<polygon points="145,760 255,825 145,890 35,825" fill="#fef2f2" stroke="#dc2626" stroke-width="2.6" filter="url(#shadow)"/>
<text x="145" y="814" text-anchor="middle" class="node">是否背景鱼？</text><text x="145" y="839" text-anchor="middle" class="small">Gate FAIL</text>
<rect x="40" y="945" width="250" height="82" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
<text x="165" y="977" text-anchor="middle" class="node">是｜背景鱼</text><text x="165" y="1003" text-anchor="middle" class="body">Final = envCoeffMin</text>
<rect x="40" y="1055" width="250" height="82" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2"/>
<text x="165" y="1087" text-anchor="middle" class="node">否｜非背景鱼</text><text x="165" y="1113" text-anchor="middle" class="body">Final = failEnvCoeff</text>
<path d="M90 890L90 930L165 930L165 945" fill="none" stroke="#dc2626" stroke-width="2.3" marker-end="url(#arrowRed)"/>
<path d="M200 890L200 1040L165 1040L165 1055" fill="none" stroke="#dc2626" stroke-width="2.3" marker-end="url(#arrowRed)"/>
<text x="104" y="922" class="edge">是</text><text x="214" y="922" class="edge">否</text>
<rect x="40" y="1185" width="250" height="72" rx="14" fill="#fff7f7" stroke="#fb7185" stroke-width="2"/>
<text x="165" y="1215" text-anchor="middle" class="node">失败分支 FinalEnvCoeff</text><text x="165" y="1241" text-anchor="middle" class="small">终止：不做环境聚合 / Floor</text>
<path d="M165 1027L165 1185" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrowRed)"/>
<path d="M165 1137L165 1185" fill="none" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrowRed)"/>
<rect x="350" y="790" width="1110" height="390" rx="26" fill="#f8faff" stroke="#4f46e5" stroke-width="2.7" filter="url(#shadow)"/>
<text x="905" y="830" text-anchor="middle" class="section">环境聚合｜所有进入这里的 Fit 在同一个阶段收束</text>
<text x="905" y="858" text-anchor="middle" class="small">CORE 与 SECONDARY 不再画成两个大阶段；这里只是一个聚合框里的两种贡献</text>
<line x1="400" y1="880" x2="1410" y2="880" stroke="#c7d2fe" stroke-width="2"/>
<rect x="430" y="910" width="400" height="110" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
<text x="630" y="946" text-anchor="middle" class="node">CORE 贡献</text><text x="630" y="976" text-anchor="middle" class="body">CoreProduct = Π CORE Fit</text><text x="630" y="1001" text-anchor="middle" class="small">只包含已通过 Gate 后计算出的 CORE Fit</text>
<rect x="870" y="910" width="500" height="135" rx="16" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
<text x="1120" y="946" text-anchor="middle" class="node">SECONDARY 贡献</text><text x="1120" y="974" text-anchor="middle" class="body">SecondaryProduct = Π SECONDARY Fit</text><text x="1120" y="1002" text-anchor="middle" class="body">SecondaryFactor = 1 − (1 − SecondaryProduct) / 4</text>
<rect x="650" y="1080" width="510" height="72" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.4"/>
<text x="905" y="1110" text-anchor="middle" class="node">RawEnvCoeff</text><text x="905" y="1137" text-anchor="middle" class="body">= CoreProduct × SecondaryFactor</text>
<path d="M630 1020L630 1050L825 1050L825 1080" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M1120 1045L1120 1055L985 1055L985 1080" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M905 1152L905 1230" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowGray)"/>
<polygon points="905,1230 1025,1300 905,1370 785,1300" fill="#f8fafc" stroke="#64748b" stroke-width="2.5" filter="url(#shadow)"/>
<text x="905" y="1289" text-anchor="middle" class="node">是否背景鱼？</text><text x="905" y="1315" text-anchor="middle" class="small">Gate 已通过</text>
<rect x="590" y="1430" width="330" height="88" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="755" y="1462" text-anchor="middle" class="node">是｜应用 Background Floor</text><text x="755" y="1490" text-anchor="middle" class="body">Final = max(RawEnvCoeff, envCoeffMin)</text>
<rect x="960" y="1430" width="300" height="88" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1110" y="1462" text-anchor="middle" class="node">否｜不应用 Floor</text><text x="1110" y="1490" text-anchor="middle" class="body">Final = RawEnvCoeff</text>
<path d="M845 1370L755 1430" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrowGray)"/>
<path d="M965 1370L1110 1430" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrowGray)"/>
<text x="800" y="1412" class="edge">是</text><text x="1020" y="1412" class="edge">否</text>
<rect x="730" y="1570" width="350" height="72" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="905" y="1601" text-anchor="middle" class="node">正常分支 FinalEnvCoeff</text><text x="905" y="1627" text-anchor="middle" class="small">来自 Raw / Background Floor</text>
<path d="M755 1518L755 1545L835 1545L835 1570" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrowGray)"/>
<path d="M1110 1518L1110 1545L975 1545L975 1570" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrowGray)"/>
<rect x="570" y="1710" width="670" height="100" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.7" filter="url(#shadow)"/>
<text x="905" y="1747" text-anchor="middle" class="node">最终只乘一次 BaseOpportunityIntensity</text><text x="905" y="1777" text-anchor="middle" class="body">SpatialDistributionWeight = BaseOpportunityIntensity × FinalEnvCoeff</text>
<rect x="1290" y="1717" width="260" height="80" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="1420" y="1749" text-anchor="middle" class="node">BaseOpportunityIntensity</text><text x="1420" y="1774" text-anchor="middle" class="small">来自 Opportunity Seed</text>
<path d="M165 1257L165 1660L650 1660L650 1710" fill="none" stroke="#dc2626" stroke-width="2.3" marker-end="url(#arrowRed)"/>
<path d="M905 1642L905 1710" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
<path d="M1290 1757L1240 1757" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrowGray)"/>
<polygon points="625,1880 1185,1880 1240,1980 570,1980" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" filter="url(#shadow)"/>
<text x="905" y="1920" text-anchor="middle" class="section">RETURN｜SpatialDistributionWeight</text><text x="905" y="1952" text-anchor="middle" class="body">未归一化空间分布权重，不是概率</text>
<path d="M905 1810L905 1880" fill="none" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arrowBlue)"/>
<rect x="1310" y="1870" width="390" height="112" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
<text x="1333" y="1900" class="node">视觉语义</text>
<line x1="1335" y1="1928" x2="1390" y2="1928" stroke="#d97706" stroke-width="3" marker-end="url(#arrowOrange)"/><text x="1405" y="1933" class="small">Gate / 控制流</text>
<line x1="1335" y1="1960" x2="1390" y2="1960" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="1405" y="1965" class="small">Fit / 数值流</text>
</svg>