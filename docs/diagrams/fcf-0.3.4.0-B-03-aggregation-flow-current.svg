<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1860" viewBox="0 0 1700 1860">
<defs>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
  <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
  <style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
    .title{font-size:32px;font-weight:700}.sub{font-size:16px;fill:#475569}
    .section{font-size:19px;font-weight:700}.node{font-size:16px;font-weight:700}
    .body{font-size:14px;fill:#334155}.small{font-size:13px;fill:#64748b}
    .tiny{font-size:12px;fill:#64748b}.edge{font-size:13px;font-weight:700}
  </style>
</defs>
<rect width="1700" height="1860" fill="#fff"/>
<text x="850" y="50" text-anchor="middle" class="title">空间机会求值｜先门控，后聚合</text>
<text x="850" y="82" text-anchor="middle" class="sub">每个因子保持一条窄竖列；左 → 右只暗示求值顺序。任一核心因子门控失败都会绕过环境聚合，直接进入统一的背景鱼判断。</text>
<text x="95" y="132" class="small">执行顺序暗示</text>
<line x1="220" y1="128" x2="1435" y2="128" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowGray)"/>
<rect x="60" y="165" width="260" height="555" rx="20" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
<rect x="350" y="165" width="260" height="555" rx="20" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
<rect x="640" y="165" width="260" height="555" rx="20" fill="#f7fdf8" stroke="#bbf7d0" stroke-width="2"/>
<rect x="930" y="165" width="260" height="555" rx="20" fill="#f7fdf8" stroke="#bbf7d0" stroke-width="2"/>
<rect x="1220" y="165" width="260" height="555" rx="20" fill="#fafafa" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="88" cy="195" r="17" fill="#e2e8f0"/><text x="88" y="201" text-anchor="middle" class="tiny">1</text>
<circle cx="378" cy="195" r="17" fill="#e2e8f0"/><text x="378" y="201" text-anchor="middle" class="tiny">2</text>
<circle cx="668" cy="195" r="17" fill="#e2e8f0"/><text x="668" y="201" text-anchor="middle" class="tiny">3</text>
<circle cx="958" cy="195" r="17" fill="#e2e8f0"/><text x="958" y="201" text-anchor="middle" class="tiny">4</text>
<polygon points="113,235 267,235 310,279 267,323 113,323 70,279" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
<text x="190" y="270" text-anchor="middle" class="node">核心因子 A（CORE）</text><text x="190" y="296" text-anchor="middle" class="small">例如：水温</text>
<polygon points="190,350 280,405 190,460 100,405" fill="#fff7ed" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
<text x="190" y="397" text-anchor="middle" class="node">门控通过？</text><text x="190" y="422" text-anchor="middle" class="small">Gate｜先判断</text>
<rect x="95" y="510" width="190" height="82" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
<text x="190" y="542" text-anchor="middle" class="node">亲和度计算</text><text x="190" y="569" text-anchor="middle" class="small">Fit｜仅门控通过后</text>
<path d="M190 323L190 350" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
<path d="M190 460L190 510" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/><text x="205" y="489" class="edge">通过</text>
<polygon points="403,235 557,235 600,279 557,323 403,323 360,279" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
<text x="480" y="270" text-anchor="middle" class="node">核心因子 B（CORE）</text><text x="480" y="296" text-anchor="middle" class="small">例如：结构</text>
<polygon points="480,350 570,405 480,460 390,405" fill="#fff7ed" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
<text x="480" y="397" text-anchor="middle" class="node">门控通过？</text><text x="480" y="422" text-anchor="middle" class="small">Gate｜先判断</text>
<rect x="385" y="510" width="190" height="82" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#shadow)"/>
<text x="480" y="542" text-anchor="middle" class="node">亲和度计算</text><text x="480" y="569" text-anchor="middle" class="small">Fit｜仅门控通过后</text>
<path d="M480 323L480 350" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
<path d="M480 460L480 510" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowOrange)"/><text x="495" y="489" class="edge">通过</text>
<circle cx="770" cy="285" r="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="770" y="276" text-anchor="middle" class="node">次要因子 A</text><text x="770" y="302" text-anchor="middle" class="small">SECONDARY</text>
<rect x="675" y="510" width="190" height="82" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
<text x="770" y="542" text-anchor="middle" class="node">亲和度计算</text><text x="770" y="569" text-anchor="middle" class="small">Fit｜无门控</text>
<path d="M770 355L770 510" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
<circle cx="1060" cy="285" r="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1060" y="276" text-anchor="middle" class="node">次要因子 B</text><text x="1060" y="302" text-anchor="middle" class="small">SECONDARY</text>
<rect x="965" y="510" width="190" height="82" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#shadow)"/>
<text x="1060" y="542" text-anchor="middle" class="node">亲和度计算</text><text x="1060" y="569" text-anchor="middle" class="small">Fit｜无门控</text>
<path d="M1060 355L1060 510" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
<rect x="1260" y="235" width="180" height="88" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1350" y="269" text-anchor="middle" class="node">忽略因子</text><text x="1350" y="295" text-anchor="middle" class="small">IGNORED｜不进入求值链</text>
<line x1="1285" y1="390" x2="1415" y2="520" stroke="#cbd5e1" stroke-width="3"/><line x1="1415" y1="390" x2="1285" y2="520" stroke="#cbd5e1" stroke-width="3"/>
<text x="1350" y="570" text-anchor="middle" class="small">无门控 · 无亲和计算 · 无聚合线</text>
<path d="M100 405L40 405L40 1260L720 1260" fill="none" stroke="#dc2626" stroke-width="2.7" marker-end="url(#arrowRed)"/>
<path d="M390 405L330 405L330 700L40 700" fill="none" stroke="#dc2626" stroke-width="2.7"/>
<text x="52" y="390" class="edge">失败</text><text x="335" y="390" class="edge">失败</text>
<text x="58" y="735" class="small">任一核心门控失败：跳过环境聚合</text>

<path d="M190 592L190 720L480 720L480 900" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M480 592L600 592L600 900" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M770 592L970 592L970 900" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>
<path d="M1060 592L1180 592L1180 900" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

<rect x="280" y="760" width="1140" height="390" rx="26" fill="#f8faff" stroke="#4f46e5" stroke-width="2.7" filter="url(#shadow)"/>
<text x="850" y="802" text-anchor="middle" class="section">环境聚合｜核心与次要亲和度在同一阶段收束</text>
<text x="850" y="830" text-anchor="middle" class="small">只有通过核心门控后得到的 CORE Fit 才能进入这里；SECONDARY Fit 无门控，直接参与次要贡献</text>
<line x1="330" y1="852" x2="1370" y2="852" stroke="#c7d2fe" stroke-width="2"/>

<rect x="390" y="900" width="420" height="110" rx="16" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
<text x="600" y="936" text-anchor="middle" class="node">核心贡献（CORE）</text>
<text x="600" y="968" text-anchor="middle" class="body">CoreProduct = Π CORE Fit</text>
<text x="600" y="993" text-anchor="middle" class="small">只包含门控通过后的核心亲和度</text>

<rect x="850" y="900" width="500" height="135" rx="16" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
<text x="1100" y="936" text-anchor="middle" class="node">次要贡献（SECONDARY）</text>
<text x="1100" y="966" text-anchor="middle" class="body">SecondaryProduct = Π SECONDARY Fit</text>
<text x="1100" y="996" text-anchor="middle" class="body">SecondaryFactor = 1 − (1 − SecondaryProduct) / 4</text>

<rect x="595" y="1065" width="510" height="62" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.4"/>
<text x="850" y="1091" text-anchor="middle" class="node">原始环境系数（RawEnvCoeff）</text>
<text x="850" y="1116" text-anchor="middle" class="body">CoreProduct × SecondaryFactor</text>

<path d="M600 1010L600 1040L775 1040L775 1065" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
<path d="M1100 1035L1100 1045L925 1045L925 1065" fill="none" stroke="#4f46e5" stroke-width="2.2" marker-end="url(#arrowBlue)"/>

<path d="M850 1127L850 1180" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowGray)"/>
<text x="868" y="1160" class="small">聚合完成</text>

<polygon points="850,1180 980,1260 850,1340 720,1260" fill="#f8fafc" stroke="#64748b" stroke-width="2.5" filter="url(#shadow)"/>
<text x="850" y="1250" text-anchor="middle" class="node">是否背景鱼？</text>
<text x="850" y="1276" text-anchor="middle" class="small">统一判断节点</text>

<rect x="430" y="1400" width="390" height="115" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="625" y="1432" text-anchor="middle" class="node">是｜背景鱼</text>
<text x="625" y="1462" text-anchor="middle" class="body">门控失败 → FinalEnvCoeff = envCoeffMin</text>
<text x="625" y="1490" text-anchor="middle" class="body">门控通过 → FinalEnvCoeff = max(RawEnvCoeff, envCoeffMin)</text>

<rect x="880" y="1400" width="390" height="115" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="1075" y="1432" text-anchor="middle" class="node">否｜非背景鱼</text>
<text x="1075" y="1462" text-anchor="middle" class="body">门控失败 → FinalEnvCoeff = failEnvCoeff</text>
<text x="1075" y="1490" text-anchor="middle" class="body">门控通过 → FinalEnvCoeff = RawEnvCoeff</text>

<path d="M790 1340L625 1400" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrowGray)"/>
<path d="M910 1340L1075 1400" fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrowGray)"/>
<text x="708" y="1385" class="edge">是</text><text x="992" y="1385" class="edge">否</text>

<rect x="650" y="1555" width="400" height="72" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="850" y="1585" text-anchor="middle" class="node">最终环境系数（FinalEnvCoeff）</text>
<text x="850" y="1611" text-anchor="middle" class="small">失败分支与正常分支在这里汇合</text>
<path d="M625 1515L625 1535L760 1535L760 1555" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrowGray)"/>
<path d="M1075 1515L1075 1535L940 1535L940 1555" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrowGray)"/>

<rect x="505" y="1665" width="690" height="96" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.7" filter="url(#shadow)"/>
<text x="850" y="1701" text-anchor="middle" class="node">最终合成｜基础机会强度只乘一次</text>
<text x="850" y="1732" text-anchor="middle" class="body">SpatialDistributionWeight = BaseOpportunityIntensity × FinalEnvCoeff</text>

<rect x="1270" y="1673" width="300" height="80" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="1420" y="1704" text-anchor="middle" class="node">基础机会强度</text>
<text x="1420" y="1730" text-anchor="middle" class="small">BaseOpportunityIntensity｜来自机会种子</text>
<path d="M850 1627L850 1665" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
<path d="M1270 1713L1195 1713" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrowGray)"/>

<polygon points="575,1790 1125,1790 1180,1840 520,1840" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3" filter="url(#shadow)"/>
<text x="850" y="1815" text-anchor="middle" class="section">返回：空间分布权重</text>
<text x="850" y="1837" text-anchor="middle" class="body">SpatialDistributionWeight｜未归一化权重，不是概率</text>
<path d="M850 1761L850 1790" fill="none" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#arrowBlue)"/>

<rect x="1270" y="1780" width="350" height="70" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
<line x1="1292" y1="1805" x2="1342" y2="1805" stroke="#d97706" stroke-width="3" marker-end="url(#arrowOrange)"/>
<text x="1355" y="1810" class="small">门控 / 控制流（Gate）</text>
<line x1="1292" y1="1833" x2="1342" y2="1833" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
<text x="1355" y="1838" class="small">亲和度 / 数值流（Fit）</text>
</svg>