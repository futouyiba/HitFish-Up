<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1580" viewBox="0 0 1500 1580">
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97706"/></marker>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".10"/></filter>
  <style>
    text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}
    .t{font-size:30px;font-weight:700}.st{font-size:16px;fill:#475569}
    .h{font-size:18px;font-weight:700}.n{font-size:16px;font-weight:700}.b{font-size:14px;fill:#334155}.s{font-size:13px;fill:#64748b}.e{font-size:13px;font-weight:700}
  </style>
</defs>
<rect width="1500" height="1580" fill="#fff"/>

<text x="750" y="48" text-anchor="middle" class="t">Spatial Opportunity｜先 Gate，再聚合</text>
<text x="750" y="78" text-anchor="middle" class="st">CORE 各自门控；任一 FAIL 直接提前返回。只有全部 PASS，CORE / SECONDARY 才进入同一个环境聚合框。</text>

<!-- role lanes -->
<rect x="55" y="120" width="650" height="545" rx="22" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
<text x="82" y="154" class="h">CORE｜核心条件</text>
<text x="82" y="180" class="s">每个 CORE：先算 Fit，再做自己的 Gate</text>

<rect x="735" y="120" width="475" height="405" rx="22" fill="#f7fdf8" stroke="#bbf7d0" stroke-width="2"/>
<text x="762" y="154" class="h">SECONDARY｜次要条件</text>
<text x="762" y="180" class="s">只有 Fit，没有 Gate；是否真正聚合取决于 CORE Gate 是否全部通过</text>

<rect x="1240" y="120" width="205" height="255" rx="22" fill="#fafafa" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1265" y="154" class="h">IGNORED</text>
<text x="1265" y="180" class="s">不消费，不接逻辑线</text>

<!-- core factors hex -->
<polygon points="128,226 282,226 325,274 282,322 128,322 85,274" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
<text x="205" y="266" text-anchor="middle" class="n">CORE 因子 A</text><text x="205" y="291" text-anchor="middle" class="s">例如：水温</text>

<polygon points="428,226 582,226 625,274 582,322 428,322 385,274" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" filter="url(#sh)"/>
<text x="505" y="266" text-anchor="middle" class="n">CORE 因子 B</text><text x="505" y="291" text-anchor="middle" class="s">例如：结构</text>

<!-- core fit -->
<rect x="105" y="365" width="200" height="78" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#sh)"/>
<text x="205" y="397" text-anchor="middle" class="n">亲和 / Fit 计算</text><text x="205" y="421" text-anchor="middle" class="s">Core Fit A</text>

<rect x="405" y="365" width="200" height="78" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" filter="url(#sh)"/>
<text x="505" y="397" text-anchor="middle" class="n">亲和 / Fit 计算</text><text x="505" y="421" text-anchor="middle" class="s">Core Fit B</text>

<!-- gates -->
<polygon points="205,475 305,535 205,595 105,535" fill="#fff7ed" stroke="#d97706" stroke-width="2.6" filter="url(#sh)"/>
<text x="205" y="529" text-anchor="middle" class="n">Gate 通过？</text><text x="205" y="553" text-anchor="middle" class="s">CORE A</text>

<polygon points="505,475 605,535 505,595 405,535" fill="#fff7ed" stroke="#d97706" stroke-width="2.6" filter="url(#sh)"/>
<text x="505" y="529" text-anchor="middle" class="n">Gate 通过？</text><text x="505" y="553" text-anchor="middle" class="s">CORE B</text>

<!-- all pass gate -->
<rect x="245" y="615" width="220" height="42" rx="21" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="355" y="641" text-anchor="middle" class="n">全部 CORE Gate = PASS</text>

<!-- secondary -->
<circle cx="835" cy="274" r="72" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" filter="url(#sh)"/>
<text x="835" y="268" text-anchor="middle" class="n">SECONDARY</text><text x="835" y="293" text-anchor="middle" class="s">因子 A</text>

<circle cx="1085" cy="274" r="72" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" filter="url(#sh)"/>
<text x="1085" y="268" text-anchor="middle" class="n">SECONDARY</text><text x="1085" y="293" text-anchor="middle" class="s">因子 B</text>

<rect x="755" y="365" width="160" height="78" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#sh)"/>
<text x="835" y="397" text-anchor="middle" class="n">亲和 / Fit</text><text x="835" y="421" text-anchor="middle" class="s">Secondary Fit A</text>

<rect x="1005" y="365" width="160" height="78" rx="14" fill="#f0fdf4" stroke="#4ade80" stroke-width="2" filter="url(#sh)"/>
<text x="1085" y="397" text-anchor="middle" class="n">亲和 / Fit</text><text x="1085" y="421" text-anchor="middle" class="s">Secondary Fit B</text>

<rect x="1268" y="226" width="150" height="92" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1343" y="263" text-anchor="middle" class="n">IGNORED 因子</text><text x="1343" y="289" text-anchor="middle" class="s">无逻辑线</text>

<!-- fail decision -->
<polygon points="355,720 490,795 355,870 220,795" fill="#fef2f2" stroke="#dc2626" stroke-width="2.7" filter="url(#sh)"/>
<text x="355" y="785" text-anchor="middle" class="n">是否背景鱼？</text>
<text x="355" y="810" text-anchor="middle" class="s">任一 CORE Gate FAIL</text>

<rect x="75" y="930" width="270" height="88" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2" filter="url(#sh)"/>
<text x="210" y="963" text-anchor="middle" class="n">是｜背景鱼</text><text x="210" y="990" text-anchor="middle" class="b">FinalEnvCoeff = envCoeffMin</text>

<rect x="380" y="930" width="295" height="88" rx="14" fill="#fff1f2" stroke="#fb7185" stroke-width="2" filter="url(#sh)"/>
<text x="527" y="963" text-anchor="middle" class="n">否｜非背景鱼</text><text x="527" y="990" text-anchor="middle" class="b">FinalEnvCoeff = fail_env_coeff</text>

<!-- unified aggregation box -->
<rect x="690" y="590" width="650" height="330" rx="24" fill="#f8faff" stroke="#4f46e5" stroke-width="2.7" filter="url(#sh)"/>
<text x="1015" y="628" text-anchor="middle" class="h">环境聚合｜仅在全部 CORE Gate PASS 后执行</text>
<line x1="735" y1="651" x2="1295" y2="651" stroke="#c7d2fe" stroke-width="2"/>

<rect x="735" y="680" width="250" height="92" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
<text x="860" y="713" text-anchor="middle" class="n">CORE 部分</text>
<text x="860" y="741" text-anchor="middle" class="b">CoreProduct = Π CORE Fit</text>

<rect x="1015" y="680" width="280" height="122" rx="14" fill="#ecfdf5" stroke="#4ade80" stroke-width="2"/>
<text x="1155" y="711" text-anchor="middle" class="n">SECONDARY 部分</text>
<text x="1155" y="738" text-anchor="middle" class="b">SecondaryProduct = Π SECONDARY Fit</text>
<text x="1155" y="767" text-anchor="middle" class="b">SecondaryFactor = 1 − (1 − Product) / 4</text>

<rect x="835" y="835" width="360" height="62" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.4"/>
<text x="1015" y="861" text-anchor="middle" class="n">合并</text>
<text x="1015" y="884" text-anchor="middle" class="b">RawEnvCoeff = CoreProduct × SecondaryFactor</text>

<!-- pass background floor -->
<polygon points="1015,970 1145,1042 1015,1114 885,1042" fill="#f8fafc" stroke="#64748b" stroke-width="2.5" filter="url(#sh)"/>
<text x="1015" y="1031" text-anchor="middle" class="n">是否背景鱼？</text>
<text x="1015" y="1056" text-anchor="middle" class="s">Gate 已全部通过</text>

<rect x="760" y="1160" width="325" height="90" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#sh)"/>
<text x="922" y="1193" text-anchor="middle" class="n">是｜应用 Background Floor</text>
<text x="922" y="1221" text-anchor="middle" class="b">Final = max(RawEnvCoeff, envCoeffMin)</text>

<rect x="1115" y="1160" width="285" height="90" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#sh)"/>
<text x="1257" y="1193" text-anchor="middle" class="n">否｜不应用 Floor</text>
<text x="1257" y="1221" text-anchor="middle" class="b">Final = RawEnvCoeff</text>

<!-- seed/base -->
<rect x="80" y="1120" width="455" height="116" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#sh)"/>
<text x="307" y="1153" text-anchor="middle" class="n">ResolvedOpportunitySeed</text>
<text x="307" y="1180" text-anchor="middle" class="b">BaseOpportunityIntensity · isBackgroundFish</text>
<text x="307" y="1206" text-anchor="middle" class="s">envCoeffMin（仅 Background）</text>

<!-- multiply -->
<rect x="500" y="1325" width="500" height="96" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2.6" filter="url(#sh)"/>
<text x="750" y="1360" text-anchor="middle" class="n">最终只乘一次 BaseOpportunityIntensity</text>
<text x="750" y="1390" text-anchor="middle" class="b">SpatialDistributionWeight = Base × FinalEnvCoeff</text>

<!-- return trapezoid -->
<polygon points="535,1470 965,1470 1015,1550 485,1550" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.8" filter="url(#sh)"/>
<text x="750" y="1504" text-anchor="middle" class="n">RETURN｜SpatialDistributionWeight</text>
<text x="750" y="1532" text-anchor="middle" class="b">未归一化空间分布权重，不是概率</text>

<!-- edges core factor to fit -->
<path d="M205 322L205 365" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
<path d="M505 322L505 365" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
<path d="M205 443L205 475" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>
<path d="M505 443L505 475" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#ao)"/>

<!-- pass core -->
<path d="M205 595L205 610L285 610L285 615" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#ao)"/>
<path d="M505 595L505 610L425 610L425 615" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#ao)"/>
<text x="225" y="608" class="e">PASS</text><text x="465" y="608" class="e">PASS</text>

<!-- fail direct to background diamond -->
<path d="M105 535L45 535L45 795L220 795" fill="none" stroke="#dc2626" stroke-width="2.6" marker-end="url(#ar)"/>
<path d="M605 535L655 535L655 795L490 795" fill="none" stroke="#dc2626" stroke-width="2.6" marker-end="url(#ar)"/>
<text x="58" y="520" class="e">FAIL</text><text x="610" y="520" class="e">FAIL</text>

<!-- pass activation to aggregation -->
<path d="M465 636L620 636L620 610L690 610" fill="none" stroke="#d97706" stroke-width="2.6" marker-end="url(#ao)"/>

<!-- core fits into aggregate only -->
<path d="M205 443L205 690L735 690" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ab)"/>
<path d="M505 443L505 710L735 710" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ab)"/>

<!-- secondary -->
<path d="M835 346L835 365" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ab)"/>
<path d="M1085 346L1085 365" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ab)"/>
<path d="M835 443L835 660L1050 660L1050 680" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#ab)"/>
<path d="M1085 443L1085 680" fill="none" stroke="#16a34a" stroke-width="2.3" marker-end="url(#ab)"/>

<!-- fail diamond to outcomes -->
<path d="M280 870L280 900L210 900L210 930" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M430 870L430 900L527 900L527 930" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="260" y="899" class="e">是</text><text x="465" y="899" class="e">否</text>

<!-- aggregate to floor -->
<path d="M1015 920L1015 970" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#ag)"/>
<path d="M950 1114L922 1160" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#ag)"/>
<path d="M1080 1114L1257 1160" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#ag)"/>
<text x="920" y="1146" class="e">是</text><text x="1160" y="1146" class="e">否</text>

<!-- seed to decisions/base -->
<path d="M535 1165L670 1165L670 795L490 795" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ag)"/>
<path d="M535 1190L680 1190L680 1042L885 1042" fill="none" stroke="#64748b" stroke-width="1.9" marker-end="url(#ag)"/>
<path d="M307 1236L307 1373L500 1373" fill="none" stroke="#64748b" stroke-width="2.0" marker-end="url(#ag)"/>

<!-- outcomes to multiply -->
<path d="M210 1018L210 1280L580 1280L580 1325" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ab)"/>
<path d="M527 1018L527 1300L660 1300L660 1325" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ab)"/>
<path d="M922 1250L922 1325" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ab)"/>
<path d="M1257 1250L1257 1300L920 1300L920 1325" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ab)"/>

<path d="M750 1421L750 1470" fill="none" stroke="#1d4ed8" stroke-width="2.8" marker-end="url(#ab)"/>

<!-- legend -->
<rect x="1110" y="1325" width="310" height="108" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
<text x="1132" y="1352" class="h">图例</text>
<line x1="1135" y1="1375" x2="1180" y2="1375" stroke="#2563eb" stroke-width="3" marker-end="url(#ab)"/><text x="1192" y="1380" class="s">Fit / 数值流</text>
<line x1="1135" y1="1407" x2="1180" y2="1407" stroke="#d97706" stroke-width="3" marker-end="url(#ao)"/><text x="1192" y="1412" class="s">Gate / 控制流</text>
</svg>